<!DOCTYPE html>  
<html lang="en">  
<head> 
  <meta charset="UTF-8"> 
  <title>IMS Dashboard — Jai Roop Textiles</title> 
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">  
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script> 
  <style> 
    :root { 
      --bg: #f0f2f5;  
      --sidebar: #0d1b2a;  
      --sidebar-hover: #1a2e47;  
      --accent: #c9a84c;  
      --accent2: #e8c96b;  
      --card: #ffffff;  
      --text: #1a202c;  
      --text-muted: #6b7280;  
      --border: #e5e7eb; 
      --danger: #dc2626;  
      --success: #059669;        --warning: #d97706;  
      --info: #2563eb;  
      --radius: 12px;  
      --shadow: 0 2px 12px rgba(0,0,0,0.08);  
      --shadow -lg: 0 8px 32px rgba(0,0,0,0.12);  
      --font: 'DM Sans' , sans-serif; 
      --mono: 'DM Mono' , monospace; 
    } 
    .dark { 
      --bg: #0a0f1a;  
      --sidebar: #060b14;  
      --sidebar-hover: #0f1c30;  
      --card: #111827;  
      --text: #f1f5f9;  
      --text-muted: #94a3b8;  
      --border: #1e293b;  
    } 
    * { box-sizing: border-box; margin: 0; padding: 0; }  
    body { font-family: var(--font); background: var( --bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }  
 
    /* SIDEBAR */ 
    aside { width: 240px; flex -shrink: 0; background: var( --sidebar); display: flex; flex-direction: column; transition: width 0.3s; overflow: hidden; }  
    .sidebar-logo { padding: 20px 16px; border -bottom: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; }     .logo-box { width: 100%; height: 68px; background: rgba(255,255,255,0.95); border -radius: 8px; display: flex; align -items: center; justify-content: center; overflow: hidden; padding: 8px; margin -bottom: 10px; }  
    .logo-box img { max-width: 100%; max -height: 100%; object-fit: contain; display: none; }  
    .logo-text { font-size: 11px; font -weight: 700; letter-spacing: 0.12em; text -align: center; color: #1a202c; line -height: 1.4; }  
    .brand-sub { color: rgba(201,168,76,0.9); font -size: 9px; letter-spacing: 0.2em; font -weight: 600; text-transform: uppercase; text-align: center; } 
    nav { padding: 12px 8px; flex -grow: 1; overflow-y: auto; } 
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border -radius: 8px; cursor: pointer; color: rgba(255,255,255,0.55); font -size: 12.5px; font -weight: 
500; transition: all 0.18s; margin -bottom: 2px; border: none; background:  none; width: 
100%; text-align: left; } 
    .nav-item:hover { background: var( --sidebar-hover); color: rgba(255,255,255,0.85); }  
    .nav-item.active { background: linear -gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.08)); color: var( --accent2); border-left: 3px solid var(--accent); padding-left: 9px; } 
    .nav-item i { width: 16px; text -align: center; font-size: 12px; } 
    .nav-section { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; color: rgba(255,255,255,0.25); padding: 14px 12px 6px; text -transform: uppercase; } 
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); font -size: 10px; color: rgba(255,255,255,0.25); }  
    .sync-time { font-size: 9px; color: rgba(201,168,76,0.6); font -family: var(--mono); }  
 
    /* MAIN */ 
    main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; } 
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align -items: center; justify-content: space-between; flex-shrink: 
0; box-shadow: var( --shadow); }  
    .header-left h1 { font-size: 16px; font -weight: 700; color: var(--text); }     .header-left p { font-size: 11px; color: var(--text-muted); } 
    .header-right { display: flex; gap: 10px; align -items: center; } 
    .btn { display: inline-flex; align -items: center; gap: 7px; padding: 8px 16px; border -radius: 
8px; font-size: 12px; font -weight: 600; cursor: pointer; border: none; transition: all 0.18s; font-family: var(--font); } 
    .btn-primary { background: var( --sidebar); color: white; } 
    .btn-primary:hover { background: #1a2e47; transform: translateY( -1px); } 
    .btn-success { background: var(--success); color: white; } 
    .btn-success:hover { background: #047857; }  
    .btn-danger { background: var(--danger); color: white; } 
    .btn-ghost { background: var( --bg); color: var(--text); border: 1px solid var(--border); } 
    .btn-ghost:hover { background: var(--border); } 
    .btn-gold { background: var(--accent); color: #1a1a1a; font -weight: 700; } 
    .btn-gold:hover { background: var(--accent2); } 
    .btn-sm { padding: 5px 10px; font -size: 11px; } 
    #content { flex-grow: 1; overflow-y: auto; padding: 24px; }  
 
    /* LOADER */ 
    #loader { position: fixed; inset: 0; background: var( --sidebar); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }  
    .loader-logo { font-size: 13px; font -weight: 700; letter-spacing: 0.25em; color: white; margin-bottom: 6px; } 
    .loader-sub { font-size: 10px; color: var(--accent); letter-spacing: 0.15em; margin -bottom: 
28px; } 
    .loader-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border -radius: 2px; overflow: hidden; }  
    .loader-fill { height: 100%; width: 0%; background: var( --accent); border-radius: 2px; animation: loadFill 1.2s ease forwards; }      @keyframes loadFill { to { width: 100%; } }  
 
    /* TOAST */ 
    #toast-container { position: fixed; bottom: 24px; right: 24px; z -index: 1001; display: flex; flex-direction: column; gap: 8px; }  
    .toast { background: var(--card); border-radius: 10px; padding: 12px 18px; font-size: 12px; font-weight: 500; display: flex; align -items: center; gap: 10px; box-shadow: var( --shadow -lg); border-left: 4px solid; animation: slideIn 0.3s ease; min -width: 280px; }  
    .toast.success { border-color: var(--success); } 
    .toast.error { border-color: var(--danger); } 
    .toast.warning { border-color: var(--warning); } 
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }  
 
    /* ALERT BANNER */ 
    .alert-banner { background: linear -gradient(135deg, #7f1d1d, #991b1b); border -radius: var(--radius); padding: 12px 18px; color: white; font -size: 12px; display: flex; align -items: center; gap: 10px; margin -bottom: 20px; }  
 
    /* KPI CARDS */ 
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 
16px; margin -bottom: 24px; }  
    .kpi-card { background: var(--card); border-radius: var(--radius); padding: 18px; box -shadow: var( --shadow); border: 1px solid var( --border); position: relative; overflow: hidden; 
} 
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }  
    .kpi-card.red::before { background: var(--danger); } 
    .kpi-card.green::before { background: var(--success); } 
    .kpi-card.amber::before { background: var(--warning); }     .kpi-card.blue::before { background: var(--info); } 
    .kpi-card.gold::before { background: var( --accent); } 
    .kpi-label { font-size: 10px; font -weight: 700; letter-spacing: 0.1em; text -transform: uppercase; color: var(--text-muted); margin -bottom: 8px; } 
    .kpi-value { font-size: 28px; font -weight: 800; line-height: 1; } 
    .kpi-card.red .kpi-value { color: var(--danger); } 
    .kpi-card.green .kpi-value { color: var(--success); } 
    .kpi-card.amber .kpi-value { color: var(--warning); } 
    .kpi-card.blue .kpi-value { color: var(--info); } 
    .kpi-card.gold .kpi-value { color: var(--accent); } 
    .kpi-sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; } 
    .kpi-icon { position: absolute; right: 14px; top: 18px; font -size: 22px; opacity: 0.12; }  
 
    /* CHARTS GRID */ 
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin -bottom: 
24px; } 
    .chart-card { background: var(--card); border-radius: var(--radius); padding: 18px; box -shadow: var( --shadow); border: 1px solid var( --border); } 
    .chart-title { font-size: 12px; font -weight: 700; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }  
    .chart-title i { color: var(--accent); } 
    canvas { max-height: 180px; }  
 
    /* TABLE CARD */ 
    .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var( --shadow); border: 1px solid var( --border); overflow: hidden; } 
    .table-header { padding: 16px 18px; border -bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }      .table-header h3 { font-size: 13px; font -weight: 700; } 
    table { width: 100%; border-collapse: collapse; font-size: 12px; } 
    thead th { background: #0d1b2a; color: rgba(255,255,255,0.85); font -size: 10px; font -weight: 700; letter-spacing: 0.08em; text -transform: uppercase; padding: 10px 14px; text -align: left; white-space: nowrap; }  
    .dark thead th { background: #060b14; }  
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }  
    tbody tr:hover { background: rgba(201,168,76,0.04); }  
    tbody td { padding: 10px 14px; color: var( --text); vertical-align: middle; }  
    .mono { font-family: var(--mono); font -size: 11px; } 
 
    /* BADGES */ 
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border -radius: 999px; font -size: 10px; font -weight: 700; letter-spacing: 0.06em; text -transform: uppercase; white-space: nowrap; }  
    .badge-pending { background: #fef3c7; color: #92400e; }  
    .badge-production { background: #dbeafe; color: #1e40af; }  
    .badge-completed { background: #d1fae5; color: #065f46; }  
    .badge-reorder { background: #fee2e2; color: #991b1b; }  
    .badge-above { background: #f3e8ff; color: #6b21a8; }  
    .badge-normal { background: #f1f5f9; color: #475569; }  
    .badge-out { background: #fef3c7; color: #92400e; }  
    .badge-done { background: #d1fae5; color: #065f46; }  
    .badge-critical { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }  
 
    /* PROGRESS BAR */     .progress-wrap { height: 6px; background: var( --border); border-radius: 4px; overflow: hidden; margin-top: 4px; } 
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }  
 
    /* SEARCH + FILTER BAR */ 
    .filter-bar { display: flex; gap: 10px; flex -wrap: wrap; align -items: center; } 
    input[type=text], input[type=date], input[type=number], select, textarea { 
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 
12px; 
      font-family: var(--font); font-size: 12px; color: var(--text); outline: none; transition: border 
0.18s;  
    } 
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 
3px rgba(201,168,76,0.15); }  
    .input-sm { padding: 6px 10px; font -size: 11px; } 
 
    /* MODAL */ 
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; padding: 16px; z -index: 100; }  
    .modal-overlay.open { display: flex; } 
    .modal { background: var( --card); border-radius: 16px; width: 100%; max -width: 580px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var( -
-shadow -lg); animation: modalIn 0.22s ease; }  
    @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } }  
    .modal-head { padding: 16px 20px; background: var( --sidebar); color: white; display: flex; justify-content: space-between; align-items: center; } 
    .modal-head h4 { font-size: 13px; font -weight: 700; letter-spacing: 0.05em; }  
    .modal-body { padding: 20px; overflow -y: auto; flex-grow: 1; }      .modal-foot { padding: 14px 20px; border -top: 1px solid var(--border); display: flex; gap: 
10px; justify-content: flex-end; background: var(--card); } 
 
    /* FORM */ 
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }  
    .form-grid .full { grid-column: 1 / -1; } 
    .form-group { display: flex; flex-direction: column; gap: 5px; }  
    .form-group label { font-size: 11px; font -weight: 700; color: var(--text-muted); letter-spacing: 0.06em; text -transform: uppercase; } 
    .form-group input, .form-group select, .form-group textarea { width: 100%; }  
 
    /* LIFECYCLE STEPS */ 
    .lifecycle { display: flex; flex-direction: column; gap: 0; position: relative; } 
    .lifecycle::before { content: ''; position: absolute; left: 14px; top: 20px; bottom: 20px; width: 2px; background: var( --border); z-index: 0; } 
    .lc-step { display: flex; gap: 14px; padding: 12px 0; position: relative; z -index: 1; } 
    .lc-dot { width: 28px; height: 28px; border -radius: 50%; display: flex; align -items: center; justify-content: center; flex-shrink: 0; font -size: 11px; font -weight: 700; color: white; }  
    .lc-dot.done { background: var(--success); } 
    .lc-dot.active { background: var( --warning); } 
    .lc-dot.pending { background: var( --border); color: var(--text-muted); }  
    .lc-content { flex-grow: 1; }  
    .lc-title { font-size: 12px; font -weight: 700; margin -bottom: 4px; } 
    .lc-detail { font-size: 11px; color: var(--text-muted); line-height: 1.5; }  
    .lc-detail p { margin: 2px 0; }  
 
    /* CLIENT ORDER CARDS */     .order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all 0.18s; border -left: 4px solid var(--accent); } 
    .order-card:hover { box-shadow: var( --shadow -lg); transform: translateY(-2px); } 
 
    /* STOCK HEALTH BAR */ 
    .stock-cell { min-width: 140px; }  
 
    /* RESPONSIVE */ 
    @media (max-width: 900px) {  
      .charts-grid { grid-template-columns: 1fr; }  
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }  
    } 
 
    /* DARK MODE TOGGLE */ 
    .toggle-dark { width: 34px; height: 18px; background: rgba(255,255,255,0.15); border -radius: 999px; position: relative; cursor: pointer; transition: background 0.2s; border: none; 
} 
    .toggle-dark .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: left 0.2s; }  
    .dark .toggle-dark { background: var(--accent); } 
    .dark .toggle-dark .knob { left: 18px; }  
 
    /* PRINT CHALLAN */ 
    @media print { 
      aside, header, .no-print { display: none !important; } 
      #content { overflow: visible; padding: 0; }        body { display: block; } 
    } 
 
    /* Animations */ 
    .fade-in { animation: fadeIn 0.3s ease; }  
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }  
 
    /* STATUS DROPDOWN in table */ 
    .status-select { border: none; background: transparent; font -size: 10px; font -weight: 700; cursor: pointer; color: inherit; font-family: var(--font); padding: 2px 4px; }  
 
    .empty-state { text-align: center; padding: 40px 20px; color: var( --text-muted); } 
    .empty-state i { font-size: 28px; margin -bottom: 10px; opacity: 0.4; }  
  </style> 
</head> 
<body> 
 
<!-- LOADER --> 
<div id="loader">  
  <div class="loader-logo">JAI ROOP TEXTILES</div> 
  <div class="loader-sub">IMS TRACKING SYSTEM V7</div> 
  <div class="loader-bar"><div class="loader -fill"></div></div> 
</div> 
 
<!-- SIDEBAR --> 
<aside id="sidebar">    <div class="sidebar-logo"> 
    <div class="logo -box"> 
      <img id="companyLogo" src="" alt="Logo">  
      <div class="logo -text" id="logoFallback">JAI ROOP<br>TEXTILES</div>  
    </div> 
    <div class="brand -sub">IMS Tracking System</div> 
  </div> 
  <nav> 
    <div class="nav-section">Overview</div> 
    <button class="nav-item active" id="nav-dashboard" onclick="switchT ab('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</button>  
    <div class="nav-section">Operations</div> 
    <button class="nav-item" id="nav-inventory" onclick="switchT ab('inventory')"><i class="fas fa -warehouse"></i> Stock / Inventory</button> 
    <button class="nav-item" id="nav-orderbook" onclick="switchT ab('orderbook')"><i class="fas fa -book-open"></i> Order Book</button> 
    <button class="nav-item" id="nav-jobwork" onclick="switchT ab('jobwork')"><i class="fas fa-tools"></i> Job Work Tracker</button> 
    <button class="nav-item" id="nav-dispatch" onclick="switchT ab('dispatch')"><i class="fas fa -truck"></i> Dispatch Log</button> 
    <div class="nav-section">Analytics</div> 
    <button class="nav-item" id="nav-clientdetails" onclick="switchT ab('clientdetails')"><i class="fas fa -users"></i> Client Portfolios</button> 
    <button class="nav-item" id="nav-alerts" onclick="switchT ab('alerts')"><i class="fas fa-bell"></i> Stock Alerts</button> 
  </nav> 
  <div class="sidebar-footer"> 
    <div>v7.0 Corporate Edition</div>     <div class="sync-time" id="lastSyncTime">—</div> 
  </div> 
</aside> 
 
<!-- MAIN CONTENT --> 
<main>  
  <header> 
    <div class="header-left"> 
      <h1 id="tab -title">Dashboard Overview</h1>  
      <p id="tab-sub">Jai Roop Textiles — Real-time IMS</p> 
    </div> 
    <div class="header-right"> 
      <button class="toggle-dark" onclick="toggleDark()" title="T oggle Dark Mode"><div class="knob"></div></button>  
      <button class="btn btn-ghost btn-sm" onclick="refreshAll()"><i class="fas fa -sync-alt"></i> Sync</button> 
    </div> 
  </header> 
 
  <div id="content"></div> 
</main>  
 
<!-- ADD ORDER MODAL --> 
<div class="modal -overlay" id="orderModal"> 
  <div class="modal">  
    <div class="modal -head">       <h4><i class="fas fa -plus-circle" style="color:var(--accent);margin-right:8px"></i>Add 
New Order</h4> 
      <button onclick="closeModal('orderModal')" style="background:none;border:none;color:white;cursor:pointer;font -size:16px"><i class="fas fa -times"></i></button> 
    </div> 
    <div class="modal -body"> 
      <div class="form -grid" id="orderForm"> 
        <div class="form -group"> 
          <label>Order Date</label> 
          <input type="date" id="f-order-date"> 
        </div> 
        <div class="form -group"> 
          <label>Client Name</label> 
          <input type="text" id="f-order-client" placeholder="Enter client name" list="client-list"> 
          <datalist id="client-list"></datalist> 
        </div> 
        <div class="form -group"> 
          <label>Item Code</label> 
          <input type="text" id="f-order-item" placeholder="e.g. 3 MM Satin" list="item-list"> 
          <datalist id="item-list"></datalist> 
        </div> 
        <div class="form -group"> 
          <label>Qty (Mtr/KG)</label> 
          <input type="number" id="f -order-qty" placeholder="0" min="0" step="0.01">  
        </div>         <div class="form -group"> 
          <label>Status</label> 
          <select id="f-order-status"> 
            <option value="Pending">Pending</option>  
            <option value="In Production">In Production</option> 
          </select> 
        </div> 
        <div class="form -group"> 
          <label>Remarks</label>  
          <input type="text" id="f-order-remarks" placeholder="Optional notes"> 
        </div> 
      </div> 
    </div> 
    <div class="modal -foot"> 
      <button class="btn btn-ghost" onclick="closeModal('orderModal')">Cancel</button>  
      <button class="btn btn-gold" onclick="submitOrder()"><i class="fas fa -save"></i> Save 
Order</button> 
    </div> 
  </div> 
</div> 
 
<!-- ADD JOB WORK MODAL --> 
<div class="modal -overlay" id="jobModal"> 
  <div class="modal">  
    <div class="modal -head"> 
      <h4><i class="fas fa -hammer" style="color:var(--accent);margin-right:8px"></i>Add Job 
Work Entry</h4>       <button onclick="closeModal('jobModal')" style="background:none;border:none;color:white;cursor:pointer;font -size:16px"><i class="fas fa -times"></i></button> 
    </div> 
    <div class="modal -body"> 
      <div class="form -grid"> 
        <div class="form -group"> 
          <label>Date</label> 
          <input type="date" id="f-job-date"> 
        </div> 
        <div class="form -group"> 
          <label>Order ID</label> 
          <input type="text" id="f-job-orderid" placeholder="ORD-... " list="order-list"> 
          <datalist id="order-list"></datalist> 
        </div> 
        <div class="form -group"> 
          <label>Worker Name</label> 
          <input type="text" id="f-job-worker" placeholder="Worker/Vendor name" list="worker-list"> 
          <datalist id="worker-list"></datalist> 
        </div> 
        <div class="form -group"> 
          <label>Item Code</label> 
          <input type="text" id="f-job-item" placeholder="Item Code" list="item-list2"> 
          <datalist id="item-list2"></datalist> 
        </div> 
        <div class="form -group">           <label>Sent Qty (Mtr)</label> 
          <input type="number" id="f -job-sent" placeholder="0" min="0" step="0.01">  
        </div> 
        <div class="form -group"> 
          <label>Received Qty (Mtr)</label> 
          <input type="number" id="f -job-received" placeholder="0" min="0" step="0.01">  
        </div> 
        <div class="form -group"> 
          <label>Wastage (Mtr)</label>  
          <input type="number" id="f -job-wastage" placeholder="0" min="0" step="0.01">  
        </div> 
        <div class="form -group"> 
          <label>Status</label> 
          <select id="f-job-status"> 
            <option value="Out">Out</option>  
            <option value="Completed">Completed</option> 
          </select> 
        </div> 
        <div class="form -group"> 
          <label>T otal Payment (₹)</label> 
          <input type="number" id="f -job-payment" placeholder="0.00" min="0" step="0.01">  
        </div> 
      </div> 
    </div> 
    <div class="modal -foot"> 
      <button class="btn btn-ghost" onclick="closeModal('jobModal')">Cancel</button>        <button class="btn btn-gold" onclick="submitJobWork()"><i class="fas fa -save"></i> 
Save Job Work</button> 
    </div> 
  </div>

 function toggleDark() { 
  document.body.classList.toggle('dark');

 function switchT ab(tab) { 
  currentT ab = tab;

  var navEl = document.getElementById('nav-' + tab);

 function buildChart(id, type, labels, data, label, colors) { 
  var ctx = document.getElementById(id); 
  if (!ctx) return; 
  if (charts[id]) charts[id].destroy();  
  var isDark = document.body.classList.contains('dark'); 
  var textColor = isDark ? '#94a3b8' : '#6b7280';  
  charts[id] = new Chart(ctx, { 
    type: type, 
    data: { 
      labels: labels, 
      datasets: [{ label: label, data: data, 
        backgroundColor: type === 'doughnut' ? colors : colors.map(function(c){return c+'dd';}), 
        borderRadius: type === 'bar' ? 6 : 0, borderWidth: 0 }]  
    }, 
    options: { 
      responsive: true, maintainAspectRatio: true, 
      plugins: { legend: { labels: { color: textColor, font: { size: 10 } } } }, 
      scales: type === 'bar' ? { x:{ticks:{color:textColor,font:{size:9}}}, y:{ticks:{color:textColor}} 
} : {} 
    } 
  }); 
} 
 function buildLineChart(id, labels, data) {    var ctx = document.getElementById(id);

 function filterJobWork() {

  if (!tbody) return;

(f||'').toLowerCase().includes(q.toLowerCase());});

    return matchQ && matchSt; 
  });

    var bal = Math.max(0, sent-recv); 
    var wastagePct = sent > 0 ? (waste/sent*100) : 0; 
    var payment = j. T otalPayment ? parseFloat(j. T otalPayment) : (recv*0.25); 
    var wastageClass = wastagePct > 4 ? 'badge badge-critical' : '';

    return `<tr>

      <td style="text-align:right;font -weight:700">${recv.toLocaleString()}</td>       <td style="text-align:right;color:var( --warning)">${bal>0?bal.toFixed(1):'<span style="color:var(--success)">Done</span>'}</td>  
      <td style="text-align:right">${waste.toFixed(2)}</td>  
      <td style="text-align:center"><span class="${wastageClass}">${wastagePct.toFixed(1)}%</span></td>

Log</h3>

 function filterDispatch() {   var q = (document.getElementById('dispSearch')||{}). value||''; 
  var dateF = (document.getElementById('dispDateFilter')||{}). value||'all'; 
  var todayStr = today(); 
  var monthStr = todayStr.substring(0,7); 
  var tbody = document.getElementById('dispBody'); 
  if (!tbody) return; 
  var items = (allData.dispatch||[]).filter(function(d) { 
    var matchQ = !q || 
[d.DispatchID,d.OrderID,d.ClientName,d.ChallanNo].some(function(f){return 
(f||'').toLowerCase().includes(q.toLowerCase());}); 
    var matchDate = dateF==='all' || (dateF==='today'&&d.DispatchDate===todayStr) || 
(dateF==='month'&&(d.DispatchDate||'').substring(0,7)===monthStr);  
    return matchQ && matchDate; 
  }); 
  var totalVol = items.reduce(function(s,d){return s+(parseFloat(d.DispatchedQty)||0);},0);  
  var totalEl = document.getElementById('dispT otal'); 
  var countEl = document.getElementById('dispCount'); 
  if (totalEl) totalEl.innerT ext = totalVol.toLocaleString()+' Mtr'; 
  if (countEl) countEl.innerT ext = items.length+' records'; 
  if (!items.length) { 
    tbody.innerHTML = '<tr><td colspan="8" class="empty -state"><i class="fas fa -shipping-fast"></i><br>No dispatches found</td></tr>';  
    return; 
  } 
  tbody.innerHTML = items.map(function(d) {  
    var orderDate = (allData.orders||[]).find(function(o){return o.OrderID===d.OrderID;}); 
    return `<tr>       <td><span class="mono" style="font -weight:700">${d.DispatchID||''}</span></td>  
      <td class="mono">${d.OrderID||''}</td> 
      <td class="mono" style="color:var( --text-muted)">${orderDate?orderDate.Date:'—
'}</td> 
      <td style="font-weight:600">${d.ClientName||''}</td> 
      <td class="mono">${d.ItemCode||''}</td>  
      <td style="text-align:right;font -weight:700">${(parseFloat(d.DispatchedQty)||0).toLocaleString()}</td>  
      <td style="font-weight:600;color:var( --success)">${d.DispatchDate||''}</td> 
      <td class="mono" style="color:var( --text-muted)">${d.ChallanNo||'—'}</td> 
    </tr>`; 
  }).join('');  
}

 function renderClientOrders() { 
  var client = document.getElementById('clientSelect'). value; 
  var container = document.getElementById('clientResult'); 
  if (!client||!container) return; 
  var orders = (allData.orders||[]).filter(function(o){return o.ClientName===client;}); 
  if (!orders.length) { 
    container.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-folder-open"></i><br>No orders for this client</div>'; 
    return; 
  } 
  container.innerHTML = orders.map(function(o) {  
    var statusMap = {'Completed':'badge-completed' , 'In Production':'badge-production' , 'Pending':'badge-pending'}; 
    var hasDispatch = (allData.dispatch||[]).some(function(d){return d.OrderID===o.OrderID;});

      <div style="display:flex;justify-content:space-between;margin-bottom:8px">  
        <span class="mono" style="font -size:11px;color:var( --text-muted)">${o.Date||''}</span>

${o.OrderID}</div>

        <span style="font-size:16px;font -weight:800">${(parseFloat(o.OrderedQtyMtrKG)||0).toLocaleString()} <span style="font-size:10px;font -weight:400;color:var( --text-muted)">Mtr</span></span>

// ===== LIFECYCLE MODAL =====  function openLifecycle(orderId) { 
  var order = (allData.orders||[]).find(function(o){return o.OrderID===orderId;}); 
  var jobs = (allData.jobWork||[]).filter(function(j){return j.OrderID===orderId;});  
  var dispatches = (allData.dispatch||[]).filter(function(d){return d.OrderID===orderId;}); 
  if (!order) return; 
  document.getElementById('lifecycleTitle').innerT ext = '           Lifecycle — ' + order.ClientName + ' | ' + orderId; 
  var step2Done = jobs.length>0; 
  var step3Done = dispatches.length>0; 
  var step4Done = order.Status==='Completed'; 
  var jobHtml = jobs.length ? jobs.map(function(j){      return '<p>Job <b>'+j.JobID+'</b> · Worker: '+j.WorkerName+' · Sent: 
'+(j.SentQtyMtr||0)+'Mtr · Recv: '+(j.ReceivedQtyMtr||0)+'Mtr · Status: '+(j.Status||'—
')+'</p>'; 
  }).join('') : '<p style="color:var(--text-muted)">No job work records yet</p>'; 
  var dispHtml = dispatches.length ? dispatches.map(function(d){  
    return '<p>Dispatch <b>'+d.DispatchID+'</b> · Qty: '+d.DispatchedQty+'Mtr · Date: 
'+d.DispatchDate+' · Challan: '+(d.ChallanNo||'—')+'</p>'; 
  }).join('') : '<p style="color:var(--text-muted)">Not yet dispatched</p>'; 
  document.getElementById('lifecycleBody').innerHTML = ` 
    <div class="lifecycle"> 
      <div class="lc-step"> 
        <div class="lc-dot done">1</div> 
        <div class="lc-content"> 
          <div class="lc-title">Order Placed</div> 
          <div class="lc-detail"> 
            <p>Date: ${order.Date||'—'} · Client: ${order.ClientName||'—'}</p> 
            <p>Item: ${order.ItemCode||'—'} · Qty: ${order.OrderedQtyMtrKG||0} Mtr</p> 
            <p>Status: <span class="badge ${order.Status==='Completed'?'badge-completed':order.Status==='In Production'?'badge-production':'badge-pending'}">${order.Status}</span></p> 
          </div> 
        </div> 
      </div> 
      <div class="lc-step"> 
        <div class="lc-dot ${step2Done?'done':'pending'}">2</div> 
        <div class="lc-content"> 
          <div class="lc-title">Job Work / Production</div>           <div class="lc-detail">${jobHtml}</div> 
        </div> 
      </div> 
      <div class="lc-step"> 
        <div class="lc-dot ${step3Done?'done':'pending'}">3</div> 
        <div class="lc-content"> 
          <div class="lc-title">Dispatch</div> 
          <div class="lc-detail">${dispHtml}</div> 
        </div> 
      </div> 
      <div class="lc-step"> 
        <div class="lc-dot ${step4Done?'done':'pending'}">4</div> 
        <div class="lc-content"> 
          <div class="lc-title">Completed</div> 
          <div class="lc-detail"> 
            ${step4Done?'<p style="color:var(--success);font-weight:600"><i class="fas fa -check-circle"></i> Order fully completed & delivered</p>':'<p style="color:var(--text-muted)">Awaiting completion</p>'} 
          </div> 
        </div> 
      </div> 
    </div> 
  `; 
  openModal('lifecycleModal'); 
} 
 
// ===== ALERTS =====  function renderAlerts(c) { 
  var alerts = []; 
  (allData.master||[]).forEach(function(item) {  
    var bal = parseFloat(item.ClosingBalance)||0; 
    var alloc = parseFloat(item.AllocatedtoOrders)||0; 
    if (item.ReorderStatus==='REORDER (LOW)') {  
      alerts.push({type:'critical' ,item:item.ItemCode,name:item.ItemName,bal:bal,alloc:alloc
,msg:'Stock at critical level — immediate reorder required'}); 
    } else if (bal>0 && alloc/bal>0.8) {  
      alerts.push({type:'warning' ,item:item.ItemCode,name:item.ItemName,bal:bal,alloc:alloc,msg:'Over 80% of stock allocated to active orders'}); 
    } 
  }); 
  var html = alerts.length ? alerts.map(function(a) {  
    var bg = a.type==='critical'?'#fee2e2':'#fef3c7'; 
    var border = a.type==='critical'?'#dc2626':'#d97706';  
    var icon = a.type==='critical'?'fa-exclamation-circle':'fa-exclamation-triangle'; 
    var iconColor = a.type==='critical'?'#dc2626':'#d97706';  
    return `<div style="background:${bg};border:1px solid ${border};border -radius:var(--radius);padding:16px;display:flex;gap:14px;align -items:flex-start"> 
      <i class="fas ${icon}" style="color:${iconColor};font -size:18px;flex-shrink:0;margin -top:2px"></i>  
      <div> 
        <div style="font-weight:700;font -size:13px">${a.item} — ${a.name||''}</div> 
        <div style="font-size:12px;color:#374151;margin -top:4px">${a.msg}</div>  
        <div style="font-size:11px;color:#6b7280;margin -top:6px">Closing Balance: 
<b>${a.bal.toLocaleString()} Mtr</b> &nbsp;|&nbsp; Allocated: 
<b>${a.alloc.toLocaleString()} Mtr</b></div>        </div> 
    </div>`; 
  }).join('') : '<div class="empty -state"><i class="fas fa -check-circle" style="color:var(--success)"></i><br>No stock alerts right now!</div>'; 
  c.innerHTML = ` 
    <div style="margin-bottom:16px;font -size:13px;font -weight:600;color:var( --text-muted)">${alerts.length} alert(s) active</div> 
    <div style="display:flex;flex-direction:column;gap:12px">${html}</div>  
  `; 
}

// ===== TOAST =====  function toast(message, type) {  
  type = type||'success'; 
  var container = document.getElementById('toast-container'); 
  var icons = {success:'fa -check-circle' ,error:'fa-times-circle' ,warning:'fa-exclamation-circle'}; 
  var colors = {success:'#059669' ,error:'#dc2626' ,warning:'#d97706'}; 
  var el = document.createElement('div'); 
  el.className = 'toast '+type;   el.innerHTML = '<i class="fas '+(icons[type]||'fa -info-circle')+'" style="color:'+colors[type]+'"></i>'+message;  
  container.appendChild(el); 
  setTimeout(function(){el.remove();},4000);  
}
