<script>
// ============================================================
// IMS V7 — Client-side controller
// ============================================================
let allData = {};
let currentTab = 'dashboard';
let charts = {};
let currentLifecycleOrderId = null;

window.onload = function() {
  ['f-order-date','f-job-date','f-disp-date','f-po-date','f-pay-date'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = today();
  });
  document.getElementById('login-pin').focus();
  google.script.run.withSuccessHandler(ctx => {
    document.getElementById('login-email').innerText = ctx.email || '(no email)';
  }).getCurrentUserContext();
};

function today() { return new Date().toISOString().split('T')[0]; }

function doLogin() {
  const pin = document.getElementById('login-pin').value;
  if (!pin) return toast('Enter PIN', 'error');
  google.script.run
    .withSuccessHandler(r => {
      if (r.ok) {
        document.getElementById('login-overlay').style.display = 'none';
        refreshAll();
      } else {
        toast(r.message, 'error');
      }
    })
    .withFailureHandler(err => toast(err.message, 'error'))
    .verifyPin(pin);
}

function refreshAll() {
  document.getElementById('loader').style.display = 'flex';
  google.script.run
    .withSuccessHandler(function(data) {
      allData = data;
      populateDataLists();
      if (data.logoUrl && data.logoUrl.length > 50) {
        document.getElementById('companyLogo').src = data.logoUrl;
        document.getElementById('companyLogo').style.display = 'block';
        document.getElementById('logoFallback').style.display = 'none';
      }
      if (data.settings && data.settings['company.name']) {
        document.getElementById('login-company').innerText = data.settings['company.name'].toUpperCase();
      }
      if (data.user) {
        document.getElementById('userPill').innerText = (data.user.name || data.user.email) + ' · ' + data.user.role;
      }
      if (data.lastSync) document.getElementById('lastSyncTime').innerText = 'Synced: ' + data.lastSync;
      renderTab();
      document.getElementById('loader').style.display = 'none';
    })
    .withFailureHandler(function(err) {
      document.getElementById('loader').style.display = 'none';
      toast('Sync failed: ' + err.message, 'error');
    })
    .getAllIMSData();
}

function populateDataLists() {
  setDataList('dl-clients', allData.clientNames || []);
  setDataList('dl-items', (allData.master || []).map(i => i.ItemCode));
  setDataList('dl-orders', (allData.orders || []).map(o => o.OrderID));
  setDataList('dl-workers', allData.workerNames || []);
  setDataList('dl-vendors', allData.vendorNames || []);
}
function setDataList(id, arr) {
  const dl = document.getElementById(id);
  if (!dl) return;
  dl.innerHTML = (arr||[]).map(v => '<option value="' + (v||'') + '">').join('');
}

function toggleDark() {
  document.body.classList.toggle('dark');
  if (Object.keys(charts).length) renderTab();
}

const TAB_TITLES = {
  dashboard:   ['Dashboard Overview', 'Live KPIs & Analytics'],
  inventory:   ['Stock / Inventory', 'Fabric stock with running balance'],
  orderbook:   ['Order Book', 'Track & manage all customer orders'],
  jobwork:     ['Job Work Tracker', 'Monitor production with workers'],
  dispatch:    ['Dispatch Log', 'Shipments, challans & invoices'],
  purchase:    ['Purchase Orders', 'Raw material procurement from vendors'],
  clients:     ['Clients', 'Customer master with GSTIN & credit'],
  vendors:     ['Vendors', 'Supplier master'],
  workers:     ['Workers', 'Job-work contractors & rates'],
  payments:    ['Payments Ledger', 'Receipts & payments'],
  receivables: ['Receivables & Payables', 'Outstanding balances'],
  reports:     ['Advanced Reports', 'ABC, aging, forecast, workers'],
  alerts:      ['Stock Alerts', 'Reorder & allocation warnings'],
  settings:    ['Settings', 'Company profile, users, automation'],
  audit:       ['Audit Log', 'Every write tracked']
};

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + tab);
  if (navEl) navEl.classList.add('active');
  if (TAB_TITLES[tab]) {
    document.getElementById('tab-title').innerText = TAB_TITLES[tab][0];
    document.getElementById('tab-sub').innerText = TAB_TITLES[tab][1];
  }
  renderTab();
}

function renderTab() {
  const c = document.getElementById('content');
  c.innerHTML = '';
  c.classList.remove('fade-in');
  void c.offsetWidth;
  c.classList.add('fade-in');
  const fn = ({
    dashboard: renderDashboard,
    inventory: renderInventory,
    orderbook: renderOrderBook,
    jobwork: renderJobWork,
    dispatch: renderDispatch,
    purchase: renderPurchase,
    clients: () => renderParty(c, 'Clients', ['ClientName','ContactPerson','Phone','Email','BillingAddress','ShippingAddress','GSTIN','PANNumber','CreditLimit','CreditDays','OutstandingReceivable','Rating','Notes']),
    vendors: () => renderParty(c, 'Vendors', ['VendorName','ContactPerson','Phone','Email','Address','GSTIN','PANNumber','BankAccount','IFSC','PaymentTerms','CreditDays','OutstandingPayable','Rating','Notes']),
    workers: () => renderParty(c, 'Workers', ['WorkerName','Phone','Address','Skill','DefaultRatePerMtr','BankAccount','IFSC','OutstandingPayable','ActiveJobs','TotalEarned','Rating','Notes']),
    payments: renderPayments,
    receivables: renderReceivables,
    reports: renderReports,
    alerts: renderAlerts,
    settings: renderSettings,
    audit: renderAudit
  })[currentTab];
  if (fn) fn(c);
}

// ===== DASHBOARD =====
function renderDashboard(c) {
  const k = allData.kpis || {};
  const reorderList = (k.reorderItems || []).join(', ') || 'None';
  const alertHtml = (k.reorderCount > 0)
    ? `<div class="alert-banner"><i class="fas fa-exclamation-triangle"></i><span><b>${k.reorderCount} item(s) need immediate reorder:</b> ${reorderList}</span></div>`
    : '';

  c.innerHTML = alertHtml + `
    <div class="kpi-grid">
      <div class="kpi-card red"><div class="kpi-label">Critical Reorders</div><div class="kpi-value">${k.reorderCount||0}</div><div class="kpi-sub">Items below min</div><i class="fas fa-exclamation-circle kpi-icon"></i></div>
      <div class="kpi-card blue"><div class="kpi-label">Active Production</div><div class="kpi-value">${k.activeOrderCount||0}</div><div class="kpi-sub">${k.pendingOrderCount||0} pending</div><i class="fas fa-cogs kpi-icon"></i></div>
      <div class="kpi-card amber"><div class="kpi-label">Live Job Batches</div><div class="kpi-value">${k.jwLiveCount||0}</div><div class="kpi-sub">Out for work</div><i class="fas fa-tools kpi-icon"></i></div>
      <div class="kpi-card green"><div class="kpi-label">Total Dispatched</div><div class="kpi-value">${(k.totalDispatched||0).toLocaleString()}</div><div class="kpi-sub">Mtr shipped</div><i class="fas fa-truck kpi-icon"></i></div>
      <div class="kpi-card gold"><div class="kpi-label">Fulfilment</div><div class="kpi-value">${k.fulfilmentRate||0}%</div><div class="kpi-sub">${k.completedOrderCount||0}/${k.totalOrderCount||0}</div><i class="fas fa-check-circle kpi-icon"></i></div>
      <div class="kpi-card purple"><div class="kpi-label">Order Value</div><div class="kpi-value">₹${((k.totalOrderValue||0)/100000).toFixed(2)}L</div><div class="kpi-sub">Total billed</div><i class="fas fa-rupee-sign kpi-icon"></i></div>
      <div class="kpi-card blue"><div class="kpi-label">Avg Wastage</div><div class="kpi-value">${k.avgWastagePct||0}%</div><div class="kpi-sub">All batches</div><i class="fas fa-cut kpi-icon"></i></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title"><i class="fas fa-chart-bar"></i> Stock by Category</div><canvas id="catChart"></canvas></div>
      <div class="chart-card"><div class="chart-title"><i class="fas fa-chart-pie"></i> Order Status Split</div><canvas id="orderChart"></canvas></div>
      <div class="chart-card"><div class="chart-title"><i class="fas fa-chart-line"></i> Top 5 by Closing Balance</div><canvas id="itemChart"></canvas></div>
      <div class="chart-card"><div class="chart-title"><i class="fas fa-chart-area"></i> Monthly Dispatch Volume (Mtr)</div><canvas id="dispChart"></canvas></div>
    </div>
  `;

  const catData = k.categoryBreakdown || {};
  const catLabels = Object.keys(catData);
  buildChart('catChart', 'bar', catLabels, catLabels.map(l => catData[l].totalStock), 'Stock (Mtr)', ['#c9a84c','#2563eb','#059669','#dc2626','#7c3aed','#0891b2']);
  buildChart('orderChart', 'doughnut', ['Completed','In Production','Pending'], [k.completedOrderCount||0, k.activeOrderCount||0, k.pendingOrderCount||0], 'Orders', ['#059669','#2563eb','#d97706']);
  const topItems = k.topItems || [];
  buildChart('itemChart', 'bar', topItems.map(i=>i.code), topItems.map(i=>i.balance), 'Balance (Mtr)', ['#0d1b2a']);
  const months = Object.keys(k.monthlyDispatch||{}).sort().slice(-6);
  buildLineChart('dispChart', months, months.map(m => k.monthlyDispatch[m]));
}

function buildChart(id, type, labels, data, label, colors) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (charts[id]) charts[id].destroy();
  const isDark = document.body.classList.contains('dark');
  const textColor = isDark ? '#94a3b8' : '#6b7280';
  charts[id] = new Chart(ctx, {
    type: type,
    data: { labels: labels, datasets: [{ label: label, data: data,
      backgroundColor: type === 'doughnut' ? colors : colors.map(c => c + 'dd'),
      borderRadius: type === 'bar' ? 6 : 0, borderWidth: 0 }]},
    options: { responsive: true, maintainAspectRatio: true,
      plugins: { legend: { labels: { color: textColor, font: { size: 10 } } } },
      scales: type === 'bar' ? { x:{ticks:{color:textColor,font:{size:9}}}, y:{ticks:{color:textColor}} } : {}
    }
  });
}
function buildLineChart(id, labels, data) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (charts[id]) charts[id].destroy();
  const isDark = document.body.classList.contains('dark');
  const textColor = isDark ? '#94a3b8' : '#6b7280';
  charts[id] = new Chart(ctx, {
    type: 'line',
    data: { labels: labels, datasets: [{ label: 'Mtr Dispatched', data: data,
      borderColor: '#c9a84c', backgroundColor: 'rgba(201,168,76,0.12)',
      tension: 0.4, fill: true, pointBackgroundColor: '#c9a84c', pointRadius: 4 }]},
    options: { responsive: true, maintainAspectRatio: true,
      plugins: { legend: { labels: { color: textColor, font: { size: 10 } } } },
      scales: { x:{ticks:{color:textColor,font:{size:9}}}, y:{ticks:{color:textColor}} } }
  });
}

// ===== INVENTORY =====
function renderInventory(c) {
  const maxBalance = Math.max.apply(null, (allData.master||[]).map(i => parseFloat(i.ClosingBalance)||0));
  const cats = [...new Set((allData.master||[]).map(i => i.Category).filter(Boolean))];
  c.innerHTML = `
    <div class="table-card">
      <div class="table-header">
        <h3><i class="fas fa-warehouse" style="color:var(--accent)"></i> All Stock Items</h3>
        <div class="filter-bar">
          <input type="text" id="invSearch" placeholder="Search item code/name..." oninput="filterInventory()" style="width:220px">
          <select id="invCat" onchange="filterInventory()"><option value="">All Categories</option>${cats.map(x=>`<option>${x}</option>`).join('')}</select>
          <select id="invStatus" onchange="filterInventory()"><option value="">All Status</option><option>REORDER (LOW)</option><option>ABOVE LEVEL</option><option>NORMAL</option></select>
          <button class="btn btn-ghost btn-sm" onclick="exportBackup()"><i class="fas fa-download"></i> Backup</button>
        </div>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Item Code</th><th>Name</th><th>Cat</th><th>Wt</th><th>Opening</th><th>In</th><th>Out</th><th>Alloc</th><th>Closing</th><th>Cost</th><th>Sell</th><th>Status</th></tr></thead>
        <tbody id="invBody"></tbody>
      </table>
      </div>
    </div>`;
  window._invMax = maxBalance;
  filterInventory();
}

function filterInventory() {
  const q = (document.getElementById('invSearch')||{}).value || '';
  const cat = (document.getElementById('invCat')||{}).value || '';
  const st = (document.getElementById('invStatus')||{}).value || '';
  const tbody = document.getElementById('invBody');
  if (!tbody) return;
  const items = (allData.master||[]).filter(it => {
    const mq = !q || (it.ItemCode||'').toLowerCase().includes(q.toLowerCase()) || (it.ItemName||'').toLowerCase().includes(q.toLowerCase());
    return mq && (!cat || it.Category===cat) && (!st || it.ReorderStatus===st);
  });
  if (!items.length) { tbody.innerHTML = emptyRow(12,'No items match','box-open'); return; }
  tbody.innerHTML = items.map(it => {
    const bal = parseFloat(it.ClosingBalance)||0;
    const pct = window._invMax > 0 ? (bal/window._invMax*100).toFixed(0) : 0;
    const barColor = it.ReorderStatus==='REORDER (LOW)' ? 'var(--danger)' : (it.ReorderStatus==='ABOVE LEVEL' ? '#7c3aed' : 'var(--success)');
    const badgeClass = it.ReorderStatus==='REORDER (LOW)' ? 'badge-reorder' : (it.ReorderStatus==='ABOVE LEVEL' ? 'badge-above' : 'badge-normal');
    return `<tr>
      <td><span class="mono">${it.ItemCode||''}</span></td>
      <td style="font-weight:600">${it.ItemName||''}</td>
      <td>${it.Category||'—'}</td>
      <td class="mono">${it.WeightMtr||'—'}</td>
      <td class="mono">${num(it.OpeningStock)}</td>
      <td class="mono" style="color:var(--success)">${num(it.TotalInMtrKG)}</td>
      <td class="mono" style="color:var(--danger)">${num(it.TotalOutMtrKG)}</td>
      <td class="mono" style="color:var(--warning)">${num(it.AllocatedtoOrders)}</td>
      <td class="stock-cell">
        <div style="font-weight:700">${num(bal)} <span style="font-size:10px;color:var(--text-muted)">Mtr</span></div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>
      </td>
      <td class="mono">${it.CostPerMtr?'₹'+num(it.CostPerMtr):'—'}</td>
      <td class="mono">${it.SellingPricePerMtr?'₹'+num(it.SellingPricePerMtr):'—'}</td>
      <td><span class="badge ${badgeClass}">${it.ReorderStatus||'NORMAL'}</span></td>
    </tr>`;
  }).join('');
}

// ===== ORDER BOOK =====
function renderOrderBook(c) {
  c.innerHTML = `
    <div class="table-card">
      <div class="table-header">
        <h3><i class="fas fa-book-open" style="color:var(--accent)"></i> Order Book</h3>
        <div class="filter-bar">
          <input type="text" id="orderSearch" placeholder="Search order/client/item..." oninput="filterOrders()" style="width:220px">
          <select id="orderStatus" onchange="filterOrders()"><option value="">All Status</option><option>Pending</option><option>In Production</option><option>Completed</option></select>
          <button class="btn btn-gold btn-sm" onclick="openModal('orderModal')"><i class="fas fa-plus"></i> New Order</button>
        </div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Order ID</th><th>Date</th><th>Client</th><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Value</th><th>Status</th><th>Priority</th><th>Action</th></tr></thead>
        <tbody id="orderBody"></tbody>
      </table></div>
    </div>`;
  filterOrders();
}

function filterOrders() {
  const q = (document.getElementById('orderSearch')||{}).value || '';
  const st = (document.getElementById('orderStatus')||{}).value || '';
  const tbody = document.getElementById('orderBody');
  if (!tbody) return;
  const items = (allData.orders||[]).filter(o => {
    const mq = !q || [o.OrderID,o.ClientName,o.ItemCode].some(f => (f||'').toLowerCase().includes(q.toLowerCase()));
    return mq && (!st || o.Status===st);
  });
  if (!items.length) { tbody.innerHTML = emptyRow(9,'No orders found','clipboard-list'); return; }
  tbody.innerHTML = items.map(o => {
    const statusMap = {'Completed':'badge-completed','In Production':'badge-production','Pending':'badge-pending'};
    return `<tr>
      <td><span class="mono" style="font-weight:700">${o.OrderID||''}</span></td>
      <td class="mono">${o.Date||''}</td>
      <td style="font-weight:600">${o.ClientName||''}</td>
      <td class="mono">${o.ItemCode||''}</td>
      <td style="text-align:right;font-weight:700">${num(o.OrderedQtyMtrKG)}</td>
      <td style="text-align:right">${o.TotalValue?'₹'+num(o.TotalValue):'—'}</td>
      <td><span class="badge ${statusMap[o.Status]||'badge-pending'}">${o.Status||''}</span></td>
      <td>${o.Priority||'Normal'}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="openLifecycle('${o.OrderID}')" title="View"><i class="fas fa-eye"></i></button>
        ${o.Status!=='Completed' ? `<select class="status-select" onchange="changeOrderStatus('${o.OrderID}',this.value)"><option value="">⇆</option><option>Pending</option><option>In Production</option><option>Completed</option></select>` : ''}
      </td></tr>`;
  }).join('');
}

function changeOrderStatus(orderId, newStatus) {
  if (!newStatus) return;
  google.script.run.withSuccessHandler(r => {
    toast(r.message, r.success ? 'success' : 'error');
    if (r.success) refreshAll();
  }).updateOrderStatus(orderId, newStatus);
}

// ===== JOB WORK =====
function renderJobWork(c) {
  const settings = allData.settings || {};
  c.innerHTML = `
    <div class="alert-banner" style="background:linear-gradient(135deg,#78350f,#92400e);margin-bottom:16px">
      <i class="fas fa-info-circle"></i>
      <span><b>Active Rules:</b> Payment @ ₹${settings['jobwork.defaultRate']||'0.25'}/Mtr · Wastage above <b>${settings['jobwork.wastageWarnPct']||'4'}%</b> flagged critical</span>
    </div>
    <div class="table-card">
      <div class="table-header">
        <h3><i class="fas fa-tools" style="color:var(--accent)"></i> Job Work Tracker</h3>
        <div class="filter-bar">
          <input type="text" id="jobSearch" placeholder="Search JobID/Worker/Order..." oninput="filterJobWork()" style="width:220px">
          <select id="jobStatus" onchange="filterJobWork()"><option value="">All Status</option><option>Out</option><option>Completed</option></select>
          <button class="btn btn-gold btn-sm" onclick="openModal('jobModal')"><i class="fas fa-plus"></i> Add Job</button>
        </div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Date</th><th>Job ID</th><th>Order</th><th>Worker</th><th>Item</th><th style="text-align:right">Sent</th><th style="text-align:right">Recv</th><th style="text-align:right">Bal</th><th>Waste %</th><th>Grade</th><th style="text-align:right">Pay</th><th>Status</th></tr></thead>
        <tbody id="jobBody"></tbody>
      </table></div>
    </div>`;
  filterJobWork();
}

function filterJobWork() {
  const q = (document.getElementById('jobSearch')||{}).value || '';
  const st = (document.getElementById('jobStatus')||{}).value || '';
  const tbody = document.getElementById('jobBody');
  if (!tbody) return;
  const warnPct = parseFloat((allData.settings||{})['jobwork.wastageWarnPct'])||4;
  const items = (allData.jobWork||[]).filter(j => {
    const mq = !q || [j.JobID,j.WorkerName,j.OrderID,j.ItemCode].some(f => (f||'').toLowerCase().includes(q.toLowerCase()));
    return mq && (!st || j.Status===st);
  });
  if (!items.length) { tbody.innerHTML = emptyRow(12,'No job work yet','hammer'); return; }
  tbody.innerHTML = items.map(j => {
    const sent = parseFloat(j.SentQtyMtr)||0, recv = parseFloat(j.ReceivedQtyMtr)||0, waste = parseFloat(j.WastageMtr)||0;
    const bal = Math.max(0, sent-recv);
    const pct = sent>0 ? (waste/sent*100) : 0;
    const wClass = pct>warnPct ? 'badge badge-critical' : '';
    const sBadge = j.Status==='Completed' ? 'badge-done' : 'badge-out';
    const pay = j.TotalPayment ? parseFloat(j.TotalPayment) : (recv*(parseFloat(j.RatePerMtr)||0.25));
    return `<tr>
      <td class="mono">${j.Date||'—'}</td>
      <td><span class="mono" style="font-weight:700">${j.JobID||''}</span></td>
      <td class="mono">${j.OrderID||''}</td>
      <td style="font-weight:600">${j.WorkerName||''}</td>
      <td class="mono">${j.ItemCode||''}</td>
      <td style="text-align:right;color:#4f46e5">${num(sent)}</td>
      <td style="text-align:right;font-weight:700">${num(recv)}</td>
      <td style="text-align:right;color:var(--warning)">${bal>0?bal.toFixed(1):'<span style="color:var(--success)">Done</span>'}</td>
      <td><span class="${wClass}">${pct.toFixed(1)}%</span></td>
      <td>${j.QualityGrade||'—'}</td>
      <td style="text-align:right;color:var(--success)">₹${pay.toFixed(2)}</td>
      <td><span class="badge ${sBadge}">${j.Status||''}</span></td>
    </tr>`;
  }).join('');
}

// ===== DISPATCH =====
function renderDispatch(c) {
  c.innerHTML = `
    <div class="table-card">
      <div class="table-header">
        <h3><i class="fas fa-truck" style="color:var(--accent)"></i> Dispatch Log</h3>
        <div class="filter-bar">
          <input type="text" id="dispSearch" placeholder="Search order/client/challan..." oninput="filterDispatch()" style="width:220px">
          <select id="dispDateFilter" onchange="filterDispatch()"><option value="all">All</option><option value="today">Today</option><option value="month">This Month</option></select>
          <button class="btn btn-gold btn-sm" onclick="openModal('dispatchModal')"><i class="fas fa-plus"></i> Log Dispatch</button>
        </div>
      </div>
      <div class="table-header" style="background:rgba(201,168,76,0.06);border-top:none">
        <div></div>
        <div style="display:flex;gap:20px;font-size:12px;font-weight:600">
          <span>Total Volume: <span id="dispTotal" style="color:var(--accent);font-size:15px;font-weight:800">—</span></span>
          <span>Records: <span id="dispCount" style="color:var(--text-muted)">—</span></span>
        </div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Dispatch ID</th><th>Order</th><th>Client</th><th>Item</th><th style="text-align:right">Qty</th><th>Date</th><th>Challan</th><th>Vehicle</th><th>Action</th></tr></thead>
        <tbody id="dispBody"></tbody>
      </table></div>
    </div>`;
  filterDispatch();
}

function filterDispatch() {
  const q = (document.getElementById('dispSearch')||{}).value || '';
  const f = (document.getElementById('dispDateFilter')||{}).value || 'all';
  const t = today(), m = t.substring(0,7);
  const tbody = document.getElementById('dispBody');
  if (!tbody) return;
  const items = (allData.dispatch||[]).filter(d => {
    const mq = !q || [d.DispatchID,d.OrderID,d.ClientName,d.ChallanNo].some(x => (x||'').toLowerCase().includes(q.toLowerCase()));
    const md = f==='all' || (f==='today'&&d.DispatchDate===t) || (f==='month'&&(d.DispatchDate||'').substring(0,7)===m);
    return mq && md;
  });

  document.getElementById('partyTitle').innerText = (existing ? 'Edit ' : 'Add ') + kind.slice(0,-1);

// ===== LIFECYCLE =====
function openLifecycle(orderId) {
  currentLifecycleOrderId = orderId;
  const order = (allData.orders||[]).find(o => o.OrderID===orderId);
  const jobs = (allData.jobWork||[]).filter(j => j.OrderID===orderId);
  const dispatches = (allData.dispatch||[]).filter(d => d.OrderID===orderId);
  if (!order) return;
  document.getElementById('lifecycleTitle').innerText = 'Lifecycle — ' + order.ClientName + ' | ' + orderId;
  const step2 = jobs.length > 0, step3 = dispatches.length > 0, step4 = order.Status==='Completed';
  const jobHtml = jobs.length ? jobs.map(j => `<p>Job <b>${j.JobID}</b> · ${j.WorkerName} · Sent ${j.SentQtyMtr} / Recv ${j.ReceivedQtyMtr} · ${j.Status}</p>`).join('') : '<p>No job work yet.</p>';
  const dHtml = dispatches.length ? dispatches.map(d => `<p>Dispatch <b>${d.DispatchID}</b> · ${d.DispatchedQty} Mtr · ${d.DispatchDate} · ${d.ChallanNo||'—'}</p>`).join('') : '<p>Not yet dispatched.</p>';
  document.getElementById('lifecycleBody').innerHTML = `
    <div class="lifecycle">
      <div class="lc-step"><div class="lc-dot done">1</div><div class="lc-content"><div class="lc-title">Order Placed</div><div class="lc-detail"><p>${order.Date} · ${order.ClientName} · ${order.ItemCode} · ${order.OrderedQtyMtrKG} Mtr</p><p>Status: <span class="badge ${order.Status==='Completed'?'badge-completed':order.Status==='In Production'?'badge-production':'badge-pending'}">${order.Status}</span></p></div></div></div>
      <div class="lc-step"><div class="lc-dot ${step2?'done':'pending'}">2</div><div class="lc-content"><div class="lc-title">Production / Job Work</div><div class="lc-detail">${jobHtml}</div></div></div>
      <div class="lc-step"><div class="lc-dot ${step3?'done':'pending'}">3</div><div class="lc-content"><div class="lc-title">Dispatch</div><div class="lc-detail">${dHtml}</div></div></div>
      <div class="lc-step"><div class="lc-dot ${step4?'done':'pending'}">4</div><div class="lc-content"><div class="lc-title">Completed</div><div class="lc-detail">${step4?'<p style="color:var(--success);font-weight:600"><i class="fas fa-check-circle"></i> Delivered.</p>':'<p>Awaiting.</p>'}</div></div></div>
    </div>`;
  openModal('lifecycleModal');
}

function generateInvoice() {
  if (!currentLifecycleOrderId) return;
  toast('Generating invoice...', 'success');
  google.script.run.withSuccessHandler(r => {
    if (r.ok) {
      toast('Invoice ' + r.invoiceNo + ' created.', 'success');
      window.open(r.url, '_blank');
    } else toast(r.message || 'Failed', 'error');
  }).withFailureHandler(err => toast(err.message, 'error')).generateInvoicePdf(currentLifecycleOrderId);
}

// ===== GLOBAL SEARCH =====
function globalSearch(q) {
  if (!q || q.length < 2) return;
  const lower = q.toLowerCase();
  let found = null;
  ['orders','master','dispatch','jobWork','purchaseOrders','clients','vendors'].some(key => {
    const list = allData[key] || [];
    const hit = list.find(row => Object.values(row).some(v => String(v||'').toLowerCase().includes(lower)));
    if (hit) { found = { key, hit }; return true; }
  });
  if (found) {
    const map = { orders:'orderbook', master:'inventory', dispatch:'dispatch', jobWork:'jobwork', purchaseOrders:'purchase', clients:'clients', vendors:'vendors' };
    switchTab(map[found.key]);
  }
}

// ===== HELPERS =====
function V(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }
function num(v) { return Number(parseFloat(v)||0).toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function emptyRow(cols, msg, icon) {
  return `<tr><td colspan="${cols}" class="empty-state"><i class="fas fa-${icon||'box-open'}"></i>${msg}</td></tr>`;
}
function toast(message, type) {
  type = type || 'success';
  const container = document.getElementById('toast-container');
  const icons = { success:'fa-check-circle', error:'fa-times-circle', warning:'fa-exclamation-circle' };
  const colors = { success:'#059669', error:'#dc2626', warning:'#d97706' };
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<i class="fas ' + (icons[type]||'fa-info-circle') + '" style="color:' + colors[type] + '"></i>' + message;
  container.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
