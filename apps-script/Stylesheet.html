<style>
:root {
  --bg: #f0f2f5;
  --sidebar: #0d1b2a;
  --sidebar-hover: #1a2e47;
  --accent: #c9a84c;
  --accent2: #e8c96b;
  --card: #ffffff;
  --text: #1a202c;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --danger: #dc2626;
  --success: #059669;
  --warning: #d97706;
  --info: #2563eb;
  --purple: #7c3aed;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
.dark {
  --bg: #0a0f1a;
  --sidebar: #060b14;
  --sidebar-hover: #0f1c30;
  --card: #111827;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: #1e293b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }

aside { width: 240px; flex-shrink: 0; background: var(--sidebar); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-logo { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; align-items: center; }
.logo-box { width: 100%; height: 68px; background: rgba(255,255,255,0.95); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; margin-bottom: 10px; }
.logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
.logo-text { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-align: center; color: #1a202c; line-height: 1.4; }
.brand-sub { color: rgba(201,168,76,0.9); font-size: 9px; letter-spacing: 0.2em; font-weight: 600; text-transform: uppercase; text-align: center; }
nav { padding: 8px; flex-grow: 1; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: rgba(255,255,255,0.55); font-size: 12.5px; font-weight: 500; transition: all 0.18s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: var(--sidebar-hover); color: rgba(255,255,255,0.85); }
.nav-item.active { background: linear-gradient(135deg, rgba(201,168,76,0.18), rgba(201,168,76,0.08)); color: var(--accent2); border-left: 3px solid var(--accent); padding-left: 9px; }
.nav-item i { width: 16px; text-align: center; font-size: 12px; }
.nav-section { font-size: 9px; font-weight: 700; letter-spacing: 0.15em; color: rgba(255,255,255,0.25); padding: 14px 12px 6px; text-transform: uppercase; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 10px; color: rgba(255,255,255,0.4); }
.sync-time { font-size: 9px; color: rgba(201,168,76,0.6); font-family: var(--mono); margin-top:4px }
.user-pill { background:rgba(201,168,76,0.12); color:var(--accent2); padding:6px 10px; border-radius:8px; font-size:10px; font-weight:700; letter-spacing:1px; margin-bottom:8px }

main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
header { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; box-shadow: var(--shadow); }
.header-left h1 { font-size: 16px; font-weight: 700; }
.header-left p { font-size: 11px; color: var(--text-muted); }
.header-right { display: flex; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.18s; font-family: var(--font); }
.btn-primary { background: var(--sidebar); color: white; }
.btn-primary:hover { background: #1a2e47; transform: translateY(-1px); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--border); }
.btn-gold { background: var(--accent); color: #1a1a1a; font-weight: 700; }
.btn-gold:hover { background: var(--accent2); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
#content { flex-grow: 1; overflow-y: auto; padding: 24px; }

#loader { position: fixed; inset: 0; background: var(--sidebar); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
.loader-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.25em; color: white; margin-bottom: 6px; }
.loader-sub { font-size: 10px; color: var(--accent); letter-spacing: 0.15em; margin-bottom: 28px; }
.loader-bar { width: 200px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
.loader-fill { height: 100%; width: 0%; background: var(--accent); animation: loadFill 1.2s ease forwards; }
@keyframes loadFill { to { width: 100%; } }

#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 1001; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--card); border-radius: 10px; padding: 12px 18px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); border-left: 4px solid; animation: slideIn 0.3s ease; min-width: 280px; }
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.alert-banner { background: linear-gradient(135deg, #7f1d1d, #991b1b); border-radius: var(--radius); padding: 12px 18px; color: white; font-size: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi-card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; overflow: hidden; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-card.red::before { background: var(--danger); }
.kpi-card.green::before { background: var(--success); }
.kpi-card.amber::before { background: var(--warning); }
.kpi-card.blue::before { background: var(--info); }
.kpi-card.gold::before { background: var(--accent); }
.kpi-card.purple::before { background: var(--purple); }
.kpi-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.kpi-value { font-size: 26px; font-weight: 800; line-height: 1; }
.kpi-card.red .kpi-value { color: var(--danger); }
.kpi-card.green .kpi-value { color: var(--success); }
.kpi-card.amber .kpi-value { color: var(--warning); }
.kpi-card.blue .kpi-value { color: var(--info); }
.kpi-card.gold .kpi-value { color: var(--accent); }
.kpi-card.purple .kpi-value { color: var(--purple); }
.kpi-sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
.kpi-icon { position: absolute; right: 14px; top: 18px; font-size: 22px; opacity: 0.12; }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.chart-card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.chart-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.chart-title i { color: var(--accent); }
canvas { max-height: 180px; }

.table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; }
.table-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.table-header h3 { font-size: 13px; font-weight: 700; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { background: #0d1b2a; color: rgba(255,255,255,0.85); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 14px; text-align: left; white-space: nowrap; }
.dark thead th { background: #060b14; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
tbody tr:hover { background: rgba(201,168,76,0.04); }
tbody td { padding: 10px 14px; color: var(--text); vertical-align: middle; }
.mono { font-family: var(--mono); font-size: 11px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.badge-pending { background: #fef3c7; color: #92400e; }
.badge-production { background: #dbeafe; color: #1e40af; }
.badge-completed, .badge-done { background: #d1fae5; color: #065f46; }
.badge-reorder, .badge-critical { background: #fee2e2; color: #991b1b; }
.badge-above { background: #f3e8ff; color: #6b21a8; }
.badge-normal { background: #f1f5f9; color: #475569; }
.badge-out { background: #fef3c7; color: #92400e; }
.badge-paid { background: #d1fae5; color: #065f46; }
.badge-unpaid { background: #fee2e2; color: #991b1b; }
.badge-partial { background: #fef3c7; color: #92400e; }
.badge-A { background: #fee2e2; color: #991b1b; }
.badge-B { background: #fef3c7; color: #92400e; }
.badge-C { background: #d1fae5; color: #065f46; }

.progress-wrap { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

.filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text], input[type=date], input[type=number], input[type=email], input[type=tel], input[type=password], select, textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-family: var(--font); font-size: 12px; color: var(--text); outline: none; transition: border 0.18s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
.input-sm { padding: 6px 10px; font-size: 11px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 580px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); animation: modalIn 0.22s ease; }
.modal.wide { max-width: 760px; }
@keyframes modalIn { from { transform: scale(0.95); opacity: 0; } }
.modal-head { padding: 16px 20px; background: var(--sidebar); color: white; display: flex; justify-content: space-between; align-items: center; }
.modal-head h4 { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
.modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; background: var(--card); }
.close-x { background:none;border:none;color:white;cursor:pointer;font-size:16px }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea { width: 100%; }

.lifecycle { display: flex; flex-direction: column; position: relative; }
.lifecycle::before { content: ''; position: absolute; left: 14px; top: 20px; bottom: 20px; width: 2px; background: var(--border); z-index: 0; }
.lc-step { display: flex; gap: 14px; padding: 12px 0; position: relative; z-index: 1; }
.lc-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 700; color: white; }
.lc-dot.done { background: var(--success); }
.lc-dot.active { background: var(--warning); }
.lc-dot.pending { background: var(--border); color: var(--text-muted); }
.lc-content { flex-grow: 1; }
.lc-title { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.lc-detail { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

.order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all 0.18s; border-left: 4px solid var(--accent); }
.order-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }

.stock-cell { min-width: 140px; }
@media (max-width: 900px) {
  .charts-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  aside { width: 64px; }
  aside .nav-item span, aside .nav-section, aside .sidebar-footer, .sidebar-logo .brand-sub, .logo-text { display: none; }
}

.toggle-dark { width: 34px; height: 18px; background: rgba(255,255,255,0.15); border-radius: 999px; position: relative; cursor: pointer; transition: background 0.2s; border: none; }
.toggle-dark .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: left 0.2s; }
.dark .toggle-dark { background: var(--accent); }
.dark .toggle-dark .knob { left: 18px; }

@media print {
  aside, header, .no-print { display: none !important; }
  #content { overflow: visible; padding: 0; }
  body { display: block; }
}

.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }

.status-select { border: 1px solid var(--border); background: var(--bg); font-size: 10px; font-weight: 700; cursor: pointer; color: inherit; font-family: var(--font); padding: 4px 8px; border-radius: 6px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state i { font-size: 28px; margin-bottom: 10px; opacity: 0.4; display: block; }

.tab-pill { display:inline-flex; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:4px; margin-bottom:16px }
.tab-pill button { background:none; border:none; padding:6px 14px; font-size:11px; font-weight:600; border-radius:999px; cursor:pointer; color:var(--text-muted); font-family:var(--font) }
.tab-pill button.active { background:var(--sidebar); color:white }

.global-search { background:var(--card); padding:6px 12px; border-radius:999px; border:1px solid var(--border); display:flex; align-items:center; gap:8px; min-width:240px }
.global-search input { border:none; background:transparent; outline:none; flex-grow:1; font-size:12px }

#login-overlay { position:fixed; inset:0; background:var(--sidebar); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px }
#login-overlay .card { background:var(--card); padding:32px; border-radius:var(--radius); width:100%; max-width:380px; box-shadow:var(--shadow-lg); text-align:center }
#login-overlay h2 { color:var(--accent); letter-spacing:3px; font-size:14px; margin-bottom:6px }
#login-overlay p { color:var(--text-muted); font-size:11px; margin-bottom:20px }
#login-overlay input { width:100%; text-align:center; font-size:22px; letter-spacing:8px; padding:14px; margin-bottom:14px }
</style>
